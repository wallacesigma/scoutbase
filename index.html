<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ScoutBase - Online</title>
    <link rel="stylesheet" href="styles.css?v=2">
    <!-- Load Supabase JS Client Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Load Your App Logic Second -->
    <script src="script.js?v=2" defer></script>
</head>
<body>

    <!-- LOGIN CONTAINER -->
    <div id="login-container">
        <h3>ScoutBase Leader Login</h3>
        <div class="login-field">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="leader@scouts.ie">
        </div>
        <div class="login-field">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="••••••••">
        </div>
        <button class="login-btn" onclick="handleLogin()">Sign In</button>
        <div id="auth-error"></div>
    </div>

    <!-- EDIT RECORD MODAL -->
    <div id="edit-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <h3>Edit Scout Record</h3>
            <input type="hidden" id="edit-id">

            <div class="field-group">
                <label for="edit-name">Name:</label>
                <input type="text" id="edit-name">
            </div>

            <div class="field-group">
                <label for="edit-unit">Unit:</label>
                <select id="edit-unit"></select>
            </div>

            <div class="field-group">
                <label for="edit-status">Status:</label>
                <select id="edit-status"></select>
            </div>

            <div class="field-group">
                <label for="edit-contact">Contact Number:</label>
                <input type="text" id="edit-contact">
            </div>

            <div class="field-group">
                <label for="edit-parent">Parent Name:</label>
                <input type="text" id="edit-parent">
            </div>

            <div class="field-group">
                <label for="edit-notes">Notes:</label>
                <input type="text" id="edit-notes">
            </div>

            <div class="modal-buttons">
                <button class="save-btn" onclick="saveRecord()">Save Changes</button>
                <button class="cancel-btn" onclick="closeModal()">Cancel</button>
            </div>
        </div>
    </div>

    <!-- MAIN APP CONTENT (Protected) -->
    <div id="app-content">
        <div class="header-scoutbase"></div>

        <div class="header-container">
            <img class="header-image" src="SBEmblem.png" alt="ScoutBase">
            <div class="scout-logo">
                <p class="scout">Scout</p>
                <p class="base">Base</p>
            </div>


            <img class="header-image" src="75thCrest.png" alt="75th Carrigrohane">
            <h2>75th Carrigrohane</h2>

            <button class="logout-btn" onclick="handleLogout()">Logout</button>
        </div>

        <div class="filter-controls">
            <div class="controls">
                <div class="filter-group">
                    <label class="filter-label" for="unit-filter"><strong>Unit:</strong></label>
                    <select id="unit-filter">
                        <option value="All">All Units</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label class="filter-label" for="status-filter"><strong>Status:</strong></label>
                    <select id="status-filter">
                        <option value="All">All Statuses</option>
                    </select>
                </div>

                <div class="total-box">
                    <label class="total-label" id="total-label"><strong>Total Records: 0</strong></label>
                </div>
            </div>
        </div>

        <table id="data-table">
            <thead>
                <tr id="table-head"></tr>
            </thead>
            <tbody id="table-body"></tbody>
        </table>
    </div>

</body>
</html>
